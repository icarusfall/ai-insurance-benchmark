# Model roster. Prices are USD per million tokens (first-party list prices at time of writing; verify
# before trusting cost numbers). cache_read / cache_write default to 0.1x / 1.25x of input if omitted.
# thinking: adaptive | none.   effort: low|medium|high|xhigh|max or null (omit).
models:
  claude-haiku-5-5:
    provider: anthropic
    input: 0.10
    output: 0.50
    thinking: adaptive
    effort: null
  claude-sonnet-5-5:
    provider: anthropic
    input: 2.00
    output: 10.00
    cache_read: 0.20
    thinking: adaptive
    effort: null
  claude-opus-5-5:
    provider: anthropic
    input: 4.00
    output: 20.00
    cache_read: 0.20
    thinking: adaptive
    effort: null
  claude-fable-5-1:
    provider: anthropic
    input: 10.00
    output: 50.00
    cache_read: 0.25
    thinking: adaptive
    effort: null

  # ---- OpenAI (direct). Prices: reference figures from OpenRouter's listing on 2026-10-17; verify against
  # OpenAI's pricing page before quoting cost numbers. Reasoning tokens are billed as output.
  gpt-5-nano:
    provider: openai
    input: 0.05
    output: 0.40
    cache_read: 0.005
    effort: null
  gpt-5.4-nano:
    provider: openai
    input: 0.20
    output: 1.25
    cache_read: 0.02
  gpt-5.6-luna:
    provider: openai
    input: 0.20
    output: 1.20
    cache_read: 0.02
  gpt-5.6-terra:
    provider: openai
    input: 2.00
    output: 12.00
    cache_read: 0.20
  gpt-5.6-sol:
    provider: openai
    input: 4.00
    output: 20.00
    cache_read: 0.40
  gpt-5.5:
    provider: openai
    input: 5.00
    output: 30.00
    cache_read: 0.50

  # ---- Gemini (direct). Same caveat on prices.
  gemini-3.5-flash-lite:
    provider: gemini
    input: 0.30
    output: 2.50
    cache_read: 0.03
  gemini-3.1-flash-lite:
    provider: gemini
    input: 0.25
    output: 1.50
    cache_read: 0.025
  gemini-3.5-flash:
    provider: gemini
    input: 1.50
    output: 9.00
    cache_read: 0.15

  # ---- Via OpenRouter (key = OpenRouter model id). Cost per call comes from OpenRouter's response,
  # so the prices here are only used for estimates.
  deepseek/deepseek-v4-flash:
    provider: openrouter
    input: 0.091
    output: 0.182
  qwen/qwen3.5-35b-a3b:
    provider: openrouter
    input: 0.15
    output: 1.00
  moonshotai/kimi-k2.6:
    provider: openrouter
    input: 0.65
    output: 3.41
    # Exception to "no special settings": at default effort Kimi spent its whole 16k output budget on hidden
    # reasoning and never called a tool (pilot preflight, 2026-10-18). Medium effort makes it playable.
    effort: medium
