- id: prediction_markets_2026_10
  peril: all
  informs: [frequency, trajectory, capital]
  lens: market
  claim: >-
    Prediction markets on 29 October 2026 put an AI-malfunction disaster (100+ deaths or $1bn) before 2032 at 90%
    (Metaculus), a $1bn rogue-AI incident before 2030 at 36% and a $1bn AI-assisted cyber loss at a financial
    institution before 2028 at 55% (Manifold). The median dates for AGI are March 2028 for a company's announcement
    (Kalshi), October 2029 for Manifold's question, and September 2030 for Metaculus's strong definition. Polymarket
    prices Anthropic and OpenAI announcing bankruptcy by 2030 at 23% and 28%.
  values: {see: catmodel/sources/market_snapshot.yaml}
  source: {title: "Metaculus, Manifold, Polymarket and Kalshi questions (one link per question in the snapshot)", publisher: Various, date: 2026-10-29, url: "https://www.metaculus.com/questions/7814/ai-incident-causes-1bn-damage-before-2032/"}
  accessed: 2026-10-29
  status: verified
  caveats: >-
    Read at each platform's own API or question page. Manifold is play money and its AI-incident markets are thin (13 to
    74 traders). Long-dated Polymarket "yes" prices are biased upwards because holding "no" ties up capital for years.
    Question definitions rarely match the model's perils, so each mapping carries a judgement (see the snapshot).
  mapping: >-
    catmodel/markets.py turns each question into a model input and builds the Markets preset: the agent and cyber
    rates, the stop horizon, and a haircut on member calls.
