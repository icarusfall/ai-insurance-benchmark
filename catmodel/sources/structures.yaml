# Structures: the AIUC proposal, precedent schemes and regulation. Schema in README.md.

- id: aiuc_mutual_proposal
  peril: structure
  informs: [layer, capital]
  lens: scratch
  claim: >-
    Trout, Kvist and Dattani propose a frontier AI mutual owned by the labs it covers, with capital "billions, we
    expect" (excess returned if incidents are few), about $1bn of cover per member as the minimum that justifies
    serious technical underwriting, three products (third-party liability including CBRN and critical
    infrastructure; first-party AI cyber; business interruption on forced rollbacks), and notice of incidents within
    24–72 hours. They argue premiums matter mainly for their information value. They cite 1970s nuclear insurers
    estimating core melts at about 1 in 400 reactor-years, within an order of magnitude of experience, against a
    government estimate of 1 in 20,000.
  values:
    min_cover_per_member_usd_bn: 1
    nuclear_core_melt_freq: {insurers_1970s: 0.0025, government_estimate: 0.00005}
  source: {title: "Bootstrapping frontier AI governance by mutualizing risk", author: "Trout, Kvist, Dattani", publisher: Lawfare, date: 2026-09-22, url: "https://www.lawfaremedia.org/article/bootstrapping-frontier-ai-governance-by-mutualizing-risk"}
  accessed: 2026-10-29
  status: verified
  caveats: No capital adequacy analysis, correlation, reinsurance or government layer; that is the gap this project fills.

- id: price_anderson
  peril: structure
  informs: [layer, capital]
  lens: parallel
  claim: >-
    US nuclear liability: a primary layer of $500m per site from the industry insurer (ANI), then a secondary layer
    of retrospective premiums of up to $158.026m per reactor per incident (inflation-adjusted October 2023), payable
    in annual instalments; with 95 covered reactors the two layers give about $15.5bn per incident.
  values:
    primary_per_site_usd_m: 500
    retro_premium_per_reactor_usd_m: 158.026
    annual_instalment_per_reactor_usd_m: 24.7
    total_per_incident_usd_bn: 15.5
  source: {title: "Nuclear energy: Price-Anderson Act (CRS In Focus IF10821)", publisher: Congressional Research Service, date: 2025-02-28, url: "https://www.everycrsreport.com/files/2025-02-28_IF10821_469962ee0d0e9a2a5e699cf9d825945a742b0152.pdf"}
  accessed: 2026-10-29
  status: secondary
  caveats: The $24.7m annual instalment predates the 2023 adjustment. The closest precedent for callable capital.

- id: tria
  peril: structure
  informs: [layer]
  lens: parallel
  claim: >-
    The US Terrorism Risk Insurance Program pays only once industry insured losses exceed $200m in a year; each
    insurer retains a deductible of 20% of its prior-year direct earned premium in covered lines, the federal share
    above that is 80%, and the program is capped at $100bn. It expires at the end of 2027; H.R. 7128 (advanced in
    committee January 2026) would extend it to 2034.
  values: {program_trigger_usd_m: 200, insurer_deductible_pct_premium: 0.20, federal_share: 0.80, cap_usd_bn: 100}
  source: {title: "The Terrorism Risk Insurance Act (TRIA) (CRS In Focus IF11090)", publisher: Congressional Research Service, date: 2026-10-09, url: "https://www.everycrsreport.com/files/2026-10-09_IF11090_e7f5396261f7ee52a76d4fc47d8fc39ccade3d70.html"}
  accessed: 2026-10-29
  status: secondary
  caveats: The template for a government layer above an industry retention.

- id: solvency2_cost_of_capital
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    The amended Solvency II Directive cuts the cost-of-capital rate in the risk margin from 6% to 4.75%, with a
    further decay factor for long-tailed business in the draft Delegated Regulation (July 2025); the revised regime
    applies from 30 January 2027.
  values: {coc_rate: {old: 0.06, new: 0.0475}, applies_from: 2027-01-30}
  source: {title: "Solvency II review: proposed amendments to the Delegated Regulation", publisher: Milliman, date: 2025-08, url: "https://us.milliman.com/en/insight/solvency-ii-review-proposed-amendments-delegated-regulation"}
  accessed: 2026-10-29
  status: secondary
  caveats: >-
    The old 6% is confirmed in Delegated Regulation Art. 39 as it stood at the end of 2020
    (https://www.legislation.gov.uk/eur/2015/35/article/39/2020-12-31, read 2026-10-29). The amended 4.75% rate and
    its legal text have not been read.

- id: solvency2_premium_reserve_sigma
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    The standard formula charges non-life premium and reserve risk as 3 × σ × volume (Delegated Regulation Art. 115),
    the factor of 3 standing in for a 99.5% lognormal shock. For general liability (Annex II, segment 5) σ is 14% for
    gross premium risk and 11% for reserve risk. Non-proportional casualty reinsurance (segment 10) uses 17% and 20%.
  values:
    multiplier: 3
    general_liability: {premium_sigma: 0.14, reserve_sigma: 0.11}
    nonprop_casualty_re: {premium_sigma: 0.17, reserve_sigma: 0.20}
  source: {title: "Commission Delegated Regulation (EU) 2015/35, Annex II and Article 115", publisher: "EU, via legislation.gov.uk and the EIOPA Single Rulebook", date: 2020-12-31, url: "https://www.legislation.gov.uk/eur/2015/35/annex/II/2020-12-31"}
  accessed: 2026-10-29
  status: verified
  caveats: >-
    Read in the UK National Archives copy of the EU text as it stood on 31 December 2020, which includes Delegated
    Regulation 2019/981. That amendment changed the credit, legal expenses and assistance rows; the general liability
    row is the same as in the 2014 text. Article 115 was read in EIOPA's rulebook
    (https://www.eiopa.europa.eu/rulebook/solvency-ii-single-rulebook/article-2552_en). EU changes after 2020 were
    not checked, because EUR-Lex would not display the 45 MB consolidated text. The model uses only the reserve σ, for the
    run-off risk in the risk margin.
  mapping: RESERVE_SIGMA in catmodel/capital_s2.py and mutual_site/public/model.js.
  checks:
    - {constant: RESERVE_SIGMA, model: "11%", source: "11% (Annex II, general liability)", result: confirmed}
    - {constant: "Run-off shock", model: "3 × σ × best estimate", source: "3 × σ × volume (Art. 115)", result: confirmed}

- id: solvency2_mcr_linear
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    The non-life MCR's linear formula sums, by segment, a factor α on net technical provisions and a factor β on net
    written premium (Delegated Regulation Art. 250, Annex XIX). For general liability (segment 8), α is 10.3% and
    β is 13.1%; for non-proportional casualty reinsurance (segment 13), 18.6% and 15.9%. The Directive holds the
    result between 25% and 45% of the SCR, subject to an absolute euro floor (Art. 129).
  values:
    general_liability: {alpha_tp: 0.103, beta_premium: 0.131}
    nonprop_casualty_re: {alpha_tp: 0.186, beta_premium: 0.159}
    corridor_of_scr: {floor: 0.25, cap: 0.45}
  source: {title: "Commission Delegated Regulation (EU) 2015/35, Annex XIX", publisher: "EU, via legislation.gov.uk", date: 2020-12-31, url: "https://www.legislation.gov.uk/eur/2015/35/annex/XIX/2020-12-31"}
  accessed: 2026-10-29
  status: verified
  caveats: >-
    Same caveat as Annex II about which version of the text was read. The corridor was read in Directive 2009/138/EC Art. 129(3)
    in EIOPA's rulebook (https://www.eiopa.europa.eu/rulebook/solvency-ii-single-rulebook/article-2216_en). The
    model ignores the absolute floor (a few million euros). A mutual writing only for AI labs could be classed as direct
    general liability; if it were structured as reinsurance of the labs' captives, the non-proportional rows
    would apply instead, which are higher.
  mapping: MCR_ALPHA_BE and MCR_BETA_PREMIUM in catmodel/capital_s2.py and mutual_site/public/model.js.
  checks:
    - {constant: MCR_ALPHA_BE, model: "10.3%", source: "10.3% (Annex XIX, general liability)", result: confirmed}
    - {constant: MCR_BETA_PREMIUM, model: "13.1%", source: "13.1% (Annex XIX, general liability)", result: confirmed}
    - {constant: MCR corridor, model: "25%–45% of SCR", source: "25%–45% of SCR (Directive Art. 129(3))", result: confirmed}

- id: solvency2_own_fund_tiers
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    Unpaid and uncalled members' contributions of a mutual, callable on demand, can be ancillary Tier 2 own funds
    (Delegated Regulation Art. 74(b)). For the SCR, Tier 1 must be at least half the requirement, and Tier 2 and 3
    together may cover at most half (Art. 82(1)). The MCR must be covered by basic own funds (Directive Art. 98(4)),
    so ancillary items do not count towards it.
  values: {tier1_min_share_scr: 0.5, tier2_3_max_share_scr: 0.5, tier3_max_share_scr: 0.15, tier1_min_share_mcr: 0.8}
  source: {title: "Commission Delegated Regulation (EU) 2015/35, Articles 74 and 82", publisher: "EU, via legislation.gov.uk and the EIOPA Single Rulebook", date: 2020-12-31, url: "https://www.legislation.gov.uk/eur/2015/35/article/82/2020-12-31"}
  accessed: 2026-10-29
  status: verified
  caveats: >-
    Article 74 was read in EIOPA's rulebook (https://www.eiopa.europa.eu/rulebook/solvency-ii-single-rulebook/article-2504_en).
    The basic-own-funds rule for the MCR is taken from the Directive's Art. 166(2), which refers to Art. 98(4);
    Art. 98 itself was not read. Ancillary own funds also need supervisory approval case by case.
  mapping: >-
    Eligible own funds for the SCR = Tier 1 + min(calls, half the SCR). The model used to cap Tier 2 at the Tier 1
    amount as well. That cap is not in Art. 82, and it only changed the ratio where Tier 1 was already below half
    the SCR, so it has been removed.
  checks:
    - {constant: Tier 2 cap, model: "min(calls, ½ SCR, Tier 1)", source: "½ SCR (Art. 82(1)(c))", result: corrected}
    - {constant: MCR own funds, model: "Tier 1 only", source: "basic own funds only (Art. 98(4))", result: confirmed}
