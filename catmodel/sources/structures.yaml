# Structures: the AIUC proposal, precedent schemes and regulation. Schema in README.md.

- id: aiuc_mutual_proposal
  peril: structure
  informs: [layer, capital]
  lens: scratch
  claim: >-
    Trout, Kvist and Dattani propose a frontier AI mutual owned by the labs it covers, with capital "billions, we
    expect" (excess returned if incidents are few), about $1bn of cover per member as the minimum that justifies
    serious technical underwriting, three products (third-party liability including CBRN and critical
    infrastructure; first-party AI cyber; business interruption on forced rollbacks), and notice of incidents within
    24–72 hours. They argue premiums matter mainly for their information value. They cite 1970s nuclear insurers
    estimating core melts at about 1 in 400 reactor-years, within an order of magnitude of experience, against a
    government estimate of 1 in 20,000.
  values:
    min_cover_per_member_usd_bn: 1
    nuclear_core_melt_freq: {insurers_1970s: 0.0025, government_estimate: 0.00005}
  source: {title: "Bootstrapping frontier AI governance by mutualizing risk", author: "Trout, Kvist, Dattani", publisher: Lawfare, date: 2026-09-22, url: "https://www.lawfaremedia.org/article/bootstrapping-frontier-ai-governance-by-mutualizing-risk"}
  accessed: 2026-10-29
  status: verified
  caveats: No capital adequacy analysis, correlation, reinsurance or government layer; that is the gap this project fills.

- id: price_anderson
  peril: structure
  informs: [layer, capital]
  lens: parallel
  claim: >-
    US nuclear liability: a primary layer of $500m per site from the industry insurer (ANI), then a secondary layer
    of retrospective premiums of up to $158.026m per reactor per incident (inflation-adjusted October 2023), payable
    in annual instalments; with 95 covered reactors the two layers give about $15.5bn per incident.
  values:
    primary_per_site_usd_m: 500
    retro_premium_per_reactor_usd_m: 158.026
    annual_instalment_per_reactor_usd_m: 24.7
    total_per_incident_usd_bn: 15.5
  source: {title: "Nuclear energy: Price-Anderson Act (CRS In Focus IF10821)", publisher: Congressional Research Service, date: 2025-02-28, url: "https://www.everycrsreport.com/files/2025-02-28_IF10821_469962ee0d0e9a2a5e699cf9d825945a742b0152.pdf"}
  accessed: 2026-10-29
  status: secondary
  caveats: The $24.7m annual instalment predates the 2023 adjustment. The closest precedent for callable capital.

- id: tria
  peril: structure
  informs: [layer]
  lens: parallel
  claim: >-
    The US Terrorism Risk Insurance Program pays only once industry insured losses exceed $200m in a year; each
    insurer retains a deductible of 20% of its prior-year direct earned premium in covered lines, the federal share
    above that is 80%, and the program is capped at $100bn. It expires at the end of 2027; H.R. 7128 (advanced in
    committee January 2026) would extend it to 2034.
  values: {program_trigger_usd_m: 200, insurer_deductible_pct_premium: 0.20, federal_share: 0.80, cap_usd_bn: 100}
  source: {title: "The Terrorism Risk Insurance Act (TRIA) (CRS In Focus IF11090)", publisher: Congressional Research Service, date: 2026-10-09, url: "https://www.everycrsreport.com/files/2026-10-09_IF11090_e7f5396261f7ee52a76d4fc47d8fc39ccade3d70.html"}
  accessed: 2026-10-29
  status: secondary
  caveats: The template for a government layer above an industry retention.

- id: solvency2_cost_of_capital
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    The amended Solvency II Directive cuts the cost-of-capital rate in the risk margin from 6% to 4.75%, with a
    further decay factor for long-tailed business in the draft Delegated Regulation (July 2025); the revised regime
    applies from 30 January 2027.
  values: {coc_rate: {old: 0.06, new: 0.0475}, applies_from: 2027-01-30}
  source: {title: "Solvency II review: proposed amendments to the Delegated Regulation", publisher: Milliman, date: 2025-08, url: "https://us.milliman.com/en/insight/solvency-ii-review-proposed-amendments-delegated-regulation"}
  accessed: 2026-10-29
  status: secondary
  caveats: >-
    The old 6% is confirmed in Delegated Regulation Art. 39 as it stood at the end of 2020
    (https://www.legislation.gov.uk/eur/2015/35/article/39/2020-12-31, read 2026-10-29). The amended 4.75% rate and
    its legal text have not been read.

- id: solvency2_premium_reserve_sigma
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    The standard formula charges non-life premium and reserve risk as 3 × σ × volume (Delegated Regulation Art. 115),
    the factor of 3 standing in for a 99.5% lognormal shock. For general liability (Annex II, segment 5) σ is 14% for
    gross premium risk and 11% for reserve risk. Non-proportional casualty reinsurance (segment 10) uses 17% and 20%.
  values:
    multiplier: 3
    general_liability: {premium_sigma: 0.14, reserve_sigma: 0.11}
    nonprop_casualty_re: {premium_sigma: 0.17, reserve_sigma: 0.20}
  source: {title: "Commission Delegated Regulation (EU) 2015/35, Annex II and Article 115", publisher: "EU, via legislation.gov.uk and the EIOPA Single Rulebook", date: 2020-12-31, url: "https://www.legislation.gov.uk/eur/2015/35/annex/II/2020-12-31"}
  accessed: 2026-10-29
  status: verified
  caveats: >-
    Read in the UK National Archives copy of the EU text as it stood on 31 December 2020, which includes Delegated
    Regulation 2019/981. That amendment changed the credit, legal expenses and assistance rows; the general liability
    row is the same as in the 2014 text. Article 115 was read in EIOPA's rulebook
    (https://www.eiopa.europa.eu/rulebook/solvency-ii-single-rulebook/article-2552_en). EU changes after 2020 were
    not checked, because EUR-Lex would not display the 45 MB consolidated text. The model uses only the reserve σ, for the
    run-off risk in the risk margin.
  mapping: RESERVE_SIGMA in catmodel/capital_s2.py and mutual_site/public/model.js.
  checks:
    - {constant: RESERVE_SIGMA, model: "11%", source: "11% (Annex II, general liability)", result: confirmed}
    - {constant: "Run-off shock", model: "3 × σ × best estimate", source: "3 × σ × volume (Art. 115)", result: confirmed}

- id: solvency2_mcr_linear
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    The non-life MCR's linear formula sums, by segment, a factor α on net technical provisions and a factor β on net
    written premium (Delegated Regulation Art. 250, Annex XIX). For general liability (segment 8), α is 10.3% and
    β is 13.1%; for non-proportional casualty reinsurance (segment 13), 18.6% and 15.9%. The Directive holds the
    result between 25% and 45% of the SCR, subject to an absolute euro floor (Art. 129).
  values:
    general_liability: {alpha_tp: 0.103, beta_premium: 0.131}
    nonprop_casualty_re: {alpha_tp: 0.186, beta_premium: 0.159}
    corridor_of_scr: {floor: 0.25, cap: 0.45}
  source: {title: "Commission Delegated Regulation (EU) 2015/35, Annex XIX", publisher: "EU, via legislation.gov.uk", date: 2020-12-31, url: "https://www.legislation.gov.uk/eur/2015/35/annex/XIX/2020-12-31"}
  accessed: 2026-10-29
  status: verified
  caveats: >-
    Same caveat as Annex II about which version of the text was read. The corridor was read in Directive 2009/138/EC Art. 129(3)
    in EIOPA's rulebook (https://www.eiopa.europa.eu/rulebook/solvency-ii-single-rulebook/article-2216_en). The
    model ignores the absolute floor (a few million euros). A mutual writing only for AI labs could be classed as direct
    general liability; if it were structured as reinsurance of the labs' captives, the non-proportional rows
    would apply instead, which are higher.
  mapping: MCR_ALPHA_BE and MCR_BETA_PREMIUM in catmodel/capital_s2.py and mutual_site/public/model.js.
  checks:
    - {constant: MCR_ALPHA_BE, model: "10.3%", source: "10.3% (Annex XIX, general liability)", result: confirmed}
    - {constant: MCR_BETA_PREMIUM, model: "13.1%", source: "13.1% (Annex XIX, general liability)", result: confirmed}
    - {constant: MCR corridor, model: "25%–45% of SCR", source: "25%–45% of SCR (Directive Art. 129(3))", result: confirmed}

- id: solvency2_own_fund_tiers
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    Unpaid and uncalled members' contributions of a mutual, callable on demand, can be ancillary Tier 2 own funds
    (Delegated Regulation Art. 74(b)). For the SCR, Tier 1 must be at least half the requirement, and Tier 2 and 3
    together may cover at most half (Art. 82(1)). The MCR must be covered by basic own funds (Directive Art. 98(4)),
    so ancillary items do not count towards it.
  values: {tier1_min_share_scr: 0.5, tier2_3_max_share_scr: 0.5, tier3_max_share_scr: 0.15, tier1_min_share_mcr: 0.8}
  source: {title: "Commission Delegated Regulation (EU) 2015/35, Articles 74 and 82", publisher: "EU, via legislation.gov.uk and the EIOPA Single Rulebook", date: 2020-12-31, url: "https://www.legislation.gov.uk/eur/2015/35/article/82/2020-12-31"}
  accessed: 2026-10-29
  status: verified
  caveats: >-
    Article 74 was read in EIOPA's rulebook (https://www.eiopa.europa.eu/rulebook/solvency-ii-single-rulebook/article-2504_en).
    The basic-own-funds rule for the MCR is taken from the Directive's Art. 166(2), which refers to Art. 98(4);
    Art. 98 itself was not read. Ancillary own funds also need supervisory approval case by case.
  mapping: >-
    Eligible own funds for the SCR = Tier 1 + min(calls, half the SCR). The model used to cap Tier 2 at the Tier 1
    amount as well. That cap is not in Art. 82, and it only changed the ratio where Tier 1 was already below half
    the SCR, so it has been removed.
  checks:
    - {constant: Tier 2 cap, model: "min(calls, ½ SCR, Tier 1)", source: "½ SCR (Art. 82(1)(c))", result: corrected}
    - {constant: MCR own funds, model: "Tier 1 only", source: "basic own funds only (Art. 98(4))", result: confirmed}

- id: naic_pc_rbc_formula
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    US P&C risk-based capital is R0 + sqrt(R1² + R2² + R3² + R4² + R5² + Rcat²), plus a basic operational risk add-on
    of 3% of that total. The authorized control level is half the result. Action levels are set on total adjusted
    capital as a share of it: company action below 200%, regulatory action below 150%, authorized control below 100%,
    mandatory control below 70%. A trend test also triggers company action between 200% and 300% if the combined ratio
    is above 120%. Rcat charges earthquake and hurricane only; wildfire and severe convective storm are reported for
    information.
  values: {operational_add_on: 0.03, acl_share_of_rbc: 0.5, company_action: 2.0, regulatory_action: 1.5, authorized_control: 1.0, mandatory_control: 0.7, trend_test: {band: [2.0, 3.0], combined_ratio_above: 1.2}}
  source: {title: "Risk-Based Capital Forecasting & Instructions, Property/Casualty, 2024", author: NAIC, publisher: "NAIC, via the Indiana Department of Insurance", date: 2024-10-14, url: "https://secure.in.gov/idoi/files/RBCP24-INpdf.pdf"}
  accessed: 2026-10-30
  status: verified
  caveats: >-
    The 2024 edition, read in a copy posted by Indiana (content.naic.org refuses automated downloads). Later editions
    may add perils to Rcat; an NAIC proposal for 2026 concerns wildfire. No edition charges man-made or AI
    catastrophe, so an AI mutual's tail would enter only through reserve and premium risk. The model leaves out asset
    risk (R0-R2), credit risk (R3) and the trend test.
  mapping: OPERATIONAL, LEVELS and the Rcat treatment in catmodel/capital_us.py and mutual_site/public/model.js.
  checks:
    - {constant: Covariance, model: "sqrt(R4² + R5² + Rcat²)", source: "R0 + sqrt(R1² … R5² + Rcat²) (PR032)", result: confirmed}
    - {constant: Operational risk, model: "none", source: "3% of RBC after covariance (PR032 L61)", result: corrected}
    - {constant: ACL, model: "½ RBC", source: "½ RBC including operational risk (PR032 L65)", result: confirmed}
    - {constant: Action levels, model: "200 / 150 / 100 / 70%", source: "200 / 150 / 100 / 70% (PR034)", result: confirmed}
    - {constant: Rcat on AI losses, model: "1-in-100 net AI loss", source: "earthquake and hurricane only (PR027)", result: corrected}

- id: naic_pc_rbc_underwriting_factors_2024
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    Reserve risk charges reserves at (1 + RBC%) × investment-income factor − 1, and premium risk charges net written
    premium at loss & LAE ratio × investment-income factor + expense ratio − 1 (each floored at zero). The industry
    factors for 2024 reporting are: other liability RBC% 51.4% and 0.858, loss ratio 1.003 and 0.827; products
    liability 101.4% and 0.843, 1.229 and 0.788; reinsurance liability 62.6% and 0.816, 1.253 and 0.794. A company is
    weighted half on its own experience, or wholly on the industry's if it has too little history. A monoline writer
    gets no concentration discount.
  values:
    other_liability: {reserve_rbc_pct: 0.514, reserve_inv: 0.858, loss_ratio: 1.003, premium_inv: 0.827}
    products_liability: {reserve_rbc_pct: 1.014, reserve_inv: 0.843, loss_ratio: 1.229, premium_inv: 0.788}
    reinsurance_liability: {reserve_rbc_pct: 0.626, reserve_inv: 0.816, loss_ratio: 1.253, premium_inv: 0.794}
  source: {title: "Risk-Based Capital Forecasting & Instructions, Property/Casualty, 2024 (PR017, PR018 and the September 2024 RBC newsletter)", author: NAIC, publisher: "NAIC, via the Indiana Department of Insurance", date: 2024-10-14, url: "https://secure.in.gov/idoi/files/RBCP24-INpdf.pdf"}
  accessed: 2026-10-30
  status: verified
  caveats: >-
    2024 factors, which moved halfway to the indicated levels; 2025 reporting moved the rest of the way, and those
    factors were not read. The loss ratio and expense ratio used together are the industry's and the model's, not an
    AI mutual's. With a 10% expense ratio the other liability premium charge is zero. At 2024 levels, a dollar of
    reserves carries about 30¢ of capital as other liability and 70¢ as products liability.
  mapping: LINES in catmodel/capital_us.py and mutual_site/public/model.js, chosen by capital.us_line.
  checks:
    - {constant: Reserve factor (other liability), model: "30% (was a 30% placeholder)", source: "1.514 × 0.858 − 1 = 29.9%", result: confirmed}
    - {constant: Premium factor (other liability), model: "0% at a 10% expense ratio (was a 30% placeholder)", source: "1.003 × 0.827 + 0.10 − 1 < 0", result: corrected}
    - {constant: Reserve factor (products liability), model: "70%", source: "2.014 × 0.843 − 1 = 69.8%", result: confirmed}

- id: naic_rbc_captive_rrgs
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    The P&C RBC report applies to captive risk retention groups. They keep GAAP books, so must use undiscounted
    reserves and deduct any reserve discount from total adjusted capital. Where the domicile's law lets an RRG count
    letters of credit as capital, they are included in surplus and total adjusted capital.
  values: {}
  source: {title: "Risk-Based Capital Forecasting & Instructions, Property/Casualty, 2024 (Applicability)", author: NAIC, publisher: "NAIC, via the Indiana Department of Insurance", date: 2024-10-14, url: "https://secure.in.gov/idoi/files/RBCP24-INpdf.pdf"}
  accessed: 2026-10-30
  status: verified
  caveats: >-
    An RRG can only write liability for its members and is chartered in one state (Liability Risk Retention Act).
    Kentucky's 2011 bulletin confirms the NAIC accreditation standards for RRG captives took effect from 2011
    (https://insurance.ky.gov/PPC/Documents/bulletin1102rrgnaicaccredit032311.pdf). The model admits no letters of
    credit; members' calls backed by them would count towards a US ratio, unlike plain uncalled assessments.
  mapping: total_adjusted_capital in catmodel/capital_us.py (paid-in capital only).

- id: factory_mutual_1835
  peril: structure
  informs: [capital]
  lens: parallel
  claim: >-
    Zachariah Allen fire-proofed his mill but could not get his insurer to lower the premium, so in 1835 he and other
    mill owners formed the Manufacturers Mutual Fire Insurance Company, which priced each mill by its fire protection
    and inspected members regularly. Its laboratory, founded in 1886, tested sprinklers, and its 1891 sprinkler
    spacing rules came before the national standard (NFPA 13). Its descendant is FM Global.
  values: {founded: 1835, laboratory: 1886, sprinkler_guidelines: 1891}
  source: {title: "FM (insurance); Zachariah Allen", publisher: "Wikipedia, with BAFSA's note 'Sprinklers and the Insurance Industry'", date: 2026, url: "https://en.wikipedia.org/wiki/FM_(insurance)"}
  accessed: 2026-10-31
  status: secondary
  caveats: >-
    Encyclopaedia and industry histories. The claim that members paid about half other insurers' rates in the first
    14 years comes from the same side and is not used. The precedent for a mutual of the insured that enforced
    standards on its own members.

- id: leung_2026_insurability_frontier
  peril: all
  informs: [layer]
  lens: market
  claim: >-
    Codes 55 AI threat classes against 26 products and exclusions from carriers' public materials. Affirmative AI cover
    is sorting by peril (Munich Re on model performance, Armilla and Lloyd's on hallucination and liability, Coalition
    on deepfakes), legacy lines carry silent AI exposure, and exclusions are spreading. Foundation-model concentration
    is the one genuinely new frontier, because one upstream failure correlates losses across many insurers. For that
    risk it ranks structures as a sequence: provider indemnities, diversification, a captive, RRG or mutual, a
    reinsurance pool, cat bonds (none yet, for want of a trigger), then a government backstop.
  values: {threat_classes: 55, products: 26}
  source: {title: "The Insurability Frontier of AI Risk: Mapping Threats to Affirmative Coverage, Silent Exposures, and Exclusions", author: "Leung, Zhang, Ling, Toyoda and Loh (AIFT)", publisher: arXiv, date: 2026-06-12, url: "https://arxiv.org/abs/2605.18784"}
  accessed: 2026-10-31
  status: verified
  caveats: >-
    Measures what carriers publicly say they cover, not what they would pay: no pricing, capital or loss distributions.
    Its buyers are AI deployers, not frontier labs.
