# Starter-for-ten parameters. Money in $bn, rates per year. Each value has low/central/high; the model uses
# `central` unless told otherwise; the pessimistic level takes `high`, or `low` where `worse: low` says a smaller
# value is the bad direction. `sources` are ids in catmodel/sources/*.yaml; `basis` says how we got there.
# Values marked "judgement" have no source yet and are placeholders to argue with.

perils:
  bio_misuse:
    label: AI-assisted engineered epidemic
    rate:
      low: 0.001
      central: 0.005
      high: 0.012
      basis: >-
        Events with harm of at least $1tn per year that a frontier model materially helped cause. FRI experts put
        the annual chance of a human-caused epidemic of that size at 0.3% today, 1.25–1.5% with AI uplift, 0.4% with
        safeguards; the AI-attributable increment runs from about 0.1% (safeguards) to 1.2% (none).
      sources: [fri_llm_biorisk_2025]
    xm: {central: 1000, basis: "Event threshold of $1tn, matching FRI's damage threshold."}
    alpha:
      low: 0.6
      central: 0.7
      high: 1.4
      worse: low
      basis: >-
        Epidemic tails fitted with a shape above 1 (Marani 0.71, Cirillo and Taleb 0.62); 1.4 is the conventional
        terrorism tail, a stand-in for the lognormal-is-fine reading (Corral).
      sources: [marani_2021_epidemic_intensity, cirillo_taleb_2020_pandemic_tail, corral_2020_lognormal_alternative, terrorism_power_law]
    cap: {central: 100000, basis: "About world GDP; harm cannot exceed everything. Judgement."}
    attribution:
      low: 0.005
      central: 0.02
      high: 0.2
      basis: >-
        Share of the harm a court would put on the lab. In US law a criminal user is normally a superseding cause
        (Restatement § 448), but not when misuse is the very hazard that makes a lab's weak safeguards negligent
        (§ 449). So the lab stays in the frame, with a small share of fault against the attacker. The high end is the
        EU's revised Product Liability Directive: from December 2026 deaths and injuries from defective software are
        strict liability, not reduced by a third party's act. The numbers within the range are judgement.
      sources: [restatement_448_449_superseding_cause, eu_product_liability_directive_2024, garcia_v_character_technologies_2025]
    insurable: {low: 0.3, central: 0.5, high: 0.8, basis: "Compensatory share after fines, punitive damages and exclusions. Judgement."}
    common_mode: {low: 0.0, central: 0.1, high: 0.5, basis: "Chance an event is caused jointly by every member's models (a shared jailbreak), splitting liability. Judgement."}
    rate_cv: {central: 1.0, basis: "Uncertainty in the rate itself (gamma-mixed Poisson); 1.0 means we barely know it."}
    payout_lag_years: {central: 5, basis: "Mean time from event to payment, mass-tort litigation. Judgement."}

  cyber_misuse:
    label: AI-enabled cyber catastrophe
    rate:
      low: 0.01
      central: 0.05
      high: 0.15
      basis: >-
        Cyber events costing at least $10bn happen roughly every one to two years (NotPetya, CrowdStrike,
        Change Healthcare's wider costs); the share materially enabled by frontier models is put at 10% today
        (2%–30%), given GTG-1002 shows AI-run intrusion campaigns already exist.
      sources: [notpetya_insured_loss, crowdstrike_2024_outage, change_healthcare_2024, anthropic_gtg1002_espionage]
    xm: {central: 10, basis: "Event threshold of $10bn, where GovAI says grid attacks become qualitatively easier than $100bn ones."}
    alpha:
      low: 0.8
      central: 1.1
      high: 1.7
      worse: low
      basis: >-
        Cyber loss data often show Hill estimates below 1; Lloyd's payment-system scenario points (1-in-30 at $2.2tn,
        1-in-1,000 at $16tn) imply about 1.7 in the far tail.
      sources: [cyber_losses_infinite_mean_type, lloyds_systemic_payment_scenario]
    cap: {central: 20000, basis: "Above Lloyd's $16tn extreme scenario. Judgement."}
    attribution:
      low: 0.0048
      central: 0.072
      high: 0.41
      basis: >-
        The product of the chain in `legal.attribution` below (catmodel/legal.py): the chance a claim survives, times
        the share of the loss victims can claim at all, times what the lab pays of that. Most cyber catastrophe losses
        are business interruption to companies with no tie to the lab, which the economic loss rule bars in negligence
        (Southern California Gas Leak Cases). Where liability is joint and several (Restatement § 14, California's
        Proposition 51 for economic damages) the lab can owe the attacker's share as well as its own. The ends multiply
        every link's end, so the range is wider than a 90% band.
      sources: [southern_california_gas_leak_2019, dittman_v_upmc_2018, restatement_third_apportionment_14, california_civil_code_1431_2, restatement_448_449_superseding_cause]
    insurable: {low: 0.4, central: 0.7, high: 0.9, basis: "War and state-actor exclusions bite (Merck). Judgement."}
    common_mode: {low: 0.0, central: 0.2, high: 0.6, basis: "Attackers can switch models; a technique that works on one often works on all. Judgement."}
    rate_cv: {central: 0.5, basis: "Better observed than bio."}
    payout_lag_years: {central: 2, basis: "Judgement."}

  agent_runaway:
    label: A lab's own agents cause harm
    rate:
      low: 0.1
      central: 0.5
      high: 2.0
      basis: >-
        Incidents with at least $10m of third-party harm caused by a lab's own agents, without a human attacker.
        One public case (OpenAI's agents breaching Hugging Face, July 2026) in roughly two years of agentic RL at scale.
      sources: [openai_huggingface_2026]
    xm: {central: 0.01, basis: "Event threshold of $10m."}
    alpha: {low: 0.8, central: 1.0, high: 1.5, worse: low, basis: "Cyber-like tail. Judgement."}
    cap: {central: 1000, basis: "Judgement."}
    attribution:
      low: 0.5
      central: 0.9
      high: 1.0
      basis: >-
        No intervening criminal act: the lab is the cause. California's AB 316 stops a lab from blaming its agents'
        autonomy, and lawyers see negligence claims as strong where safeguards were switched off. It sits below 1
        because victims may not sue (Hugging Face chose not to), others in the chain share fault (evaluation
        contractors, the victim's own security), and the first suit, LASST v. OpenAI, seeks an injunction, not damages.
      sources: [california_ab316_2025, techcrunch_ai_hack_liability_2026, lasst_v_openai_2026, openai_huggingface_2026]
    insurable: {low: 0.6, central: 0.8, high: 0.9, basis: "Judgement."}
    common_mode: {central: 0.0, basis: "One lab's agents."}
    rate_cv: {central: 0.5, basis: "Judgement."}
    payout_lag_years: {central: 1, basis: "Judgement."}

members:
  count: {central: 5, basis: "Frontier labs in the mutual. Judgement."}
  revenue:
    low: 10
    central: 25
    high: 65
    worse: low
    basis: >-
      Annual revenue per member, $bn. Anthropic's run rate was about $65bn in July 2026 (its H1 revenue, $16.3bn, is a
      $33bn pace) and OpenAI's about $50bn in September. The other likely members' frontier-model revenue is not
      disclosed; we put it at about $5bn each, which makes the average about $25bn. Judgement for those three.
    sources: [anthropic_s1_revenue_2026, openai_revenue_ft_2026]

structure:
  per_event_limit: {central: 1.0, basis: "AIUC's suggested minimum cover per member.", sources: [aiuc_mutual_proposal]}
  annual_aggregate: {central: 2.0, basis: "Per member, all perils. Judgement."}
  paid_in_capital: {central: 5.0, basis: "AIUC expects 'billions'.", sources: [aiuc_mutual_proposal]}
  callable_per_member: {central: 1.0, basis: "Retrospective assessment per member per year, as in Price-Anderson's second layer.", sources: [price_anderson]}
  reinsurance_attach: {central: 0.0, basis: "Off by default (limit 0)."}
  reinsurance_limit: {central: 0.0, basis: "Off by default."}
  government_attach: {central: 0.0, basis: "Off by default (share 0). TRIA is the template.", sources: [tria]}
  government_share: {central: 0.0, basis: "Off by default."}

pricing:
  expense_ratio: {central: 0.10, basis: "Judgement."}
  cost_of_capital: {low: 0.06, central: 0.10, high: 0.15, basis: "Return required on capital held. Judgement."}
  catbond_multiple: {low: 3.0, central: 10.0, high: 15.0, basis: "Spread as a multiple of expected loss: about 3x for natural catastrophe, about 10x for the first cyber bonds.", sources: [cat_bond_multiples_by_year, cyber_cat_bond_polestar]}
  wang_lambda:
    low: 0.47
    central: 0.89
    high: 1.11
    basis: >-
      Wang transform shift fitted to each bond's spread: median 0.47 for 58 natural catastrophe bonds (2025-26), median
      0.89 and at most 1.11 for 9 cyber tranches (2023-26). An AI bond is priced like cyber, a new and poorly modelled peril;
      that is a judgement.
    sources: [catbond_refit_2023_26]

capital:
  s2_coc: {central: 0.0475, basis: "Solvency II risk margin cost of capital from 2027.", sources: [solvency2_cost_of_capital]}
  discount_rate: {central: 0.04, basis: "Judgement."}
  us_line:
    central: other_liability
    basis: >-
      The NAIC line whose industry RBC factors apply: other_liability (as a direct general liability writer, matching the
      Solvency II segment), products_liability (if AI harms are treated as product defects, as the AI LEAD Act would) or
      reinsurance_liability (if the mutual reinsures the labs' captives).
    sources: [naic_pc_rbc_underwriting_factors_2024]

# How fast capability grows, and how the perils' rates respond (catmodel/trajectory.py). Capability is METR's 50% time
# horizon in hours. Each year's rates are today's times min(cap, (horizon that year / horizon now) ^ elasticity).
capability:
  anchor_date: {central: "2026-04-07", basis: "Release of the best model METR has measured, an early Claude Mythos Preview.", sources: [metr_time_horizon_2026]}
  anchor_hours: {central: 17.4, basis: "Its 50% time horizon (95% CI 8.5 to 55 hours; unreliable above 16).", sources: [metr_time_horizon_2026]}
  now: {central: "2026-10-29", basis: "The date the perils' rates describe."}
  first_year: {central: 2027}
  last_year: {central: 2035}
  trajectory: {central: metr_2023, basis: "Which path the horizon takes: ai2027, metr_2023, metr_long_run or plateau."}
  metr_2023_doubling_days: {central: 128.7, basis: "METR's fitted doubling time for models since 2023.", sources: [metr_time_horizon_2026]}
  metr_long_run_doubling_days: {central: 187.8, basis: "METR's fitted doubling time for all models since 2019.", sources: [metr_time_horizon_2026]}
  ai2027_doubling_days:
    central: 88.8
    basis: >-
      AI 2027's next doubling at full pace: 4.5 months in March 2025, 10% shorter for each of the 4.1 doublings since.
    sources: [ai2027_timelines_forecast]
  ai2027_shrink: {central: 0.9, basis: "Each successive doubling takes 10% less time.", sources: [ai2027_timelines_forecast]}
  ai2027_pace:
    low: 0.6
    central: 0.75
    high: 1.0
    basis: "Reality ran at 70-90% of AI 2027's pace by August 2026; 60% is the authors' own slower case."
    sources: [aifutures_q25_2026_update]
  plateau_ceiling_hours:
    low: 40
    central: 167
    high: 1000
    basis: >-
      The plateau starts at METR's recent slope and flattens towards this ceiling: one work-week, one work-month, six
      work-months. METR's data show no flattening yet, so this is an assumption to argue with.
    sources: [whitfill_2025_compute_slowdown, metr_time_horizon_2026]
  stop_hours:
    central: 1000
    basis: >-
      Past this horizon (about six work-months, AI 2027's median for a superhuman coder) the model stops: AGI follows
      within a year or so in the AI 2027 authors' forecasts, and loss of control is out of scope. Judgement.
    sources: [ai2027_timelines_forecast, aifutures_q25_2026_update]
  revenue_growth:
    low: 1.0
    central: 2.0
    high: 4.0
    worse: low
    basis: >-
      Members' revenue multiplies by this each year. The AI 2027 authors assume 5-7x a year for the leading lab in
      the near term; a sustained average across five labs is surely lower. Judgement.
    sources: [aifutures_q25_2026_update]
  elasticity:
    bio_misuse:
      low: 0.05
      central: 0.15
      high: 0.3
      basis: >-
        Most of the uplift has already happened: FRI's forecasters treat o3 as matching top virologists, and their
        multiple-capabilities case (2.3%) is only about 1.5x the single-capability one (1.5%). Judgement.
      sources: [fri_llm_biorisk_2025]
    cyber_misuse: {low: 0.1, central: 0.3, high: 0.6, basis: "Longer horizons let agents run whole intrusion campaigns (GTG-1002). Judgement.", sources: [anthropic_gtg1002_espionage]}
    agent_runaway: {low: 0.5, central: 1.0, high: 1.2, basis: "Harm scales with how long agents run unsupervised, so roughly with the horizon. Judgement."}
  cap_multiple:
    bio_misuse: {central: 1.5, basis: "FRI's multiple-capabilities case over its single-capability case.", sources: [fri_llm_biorisk_2025]}
    cyber_misuse: {central: 5, basis: "Judgement."}
    agent_runaway: {central: 50, basis: "Judgement."}

# How often each peril's events happen, three ways (catmodel/frequency.py). `expert` uses each peril's `rate` above;
# `actuarial` uses only the observed record of AI-attributable events; `causal` multiplies the links of a chain of
# events. Severity, attribution and everything downstream are the same under all three.
frequency:
  method: {central: expert, basis: "expert, actuarial or causal."}
  actuarial:
    bio_misuse:
      events: 0
      since: "2023-03-14"
      basis: >-
        No AI-assisted epidemic, of any size, since frontier models became useful to non-experts (GPT-4, March 2023).
    cyber_misuse:
      events: 0
      since: "2023-03-14"
      basis: >-
        No $10bn+ cyber event has been attributed to AI help, though AI-run intrusion campaigns now exist (GTG-1002).
      sources: [anthropic_gtg1002_espionage]
    agent_runaway:
      events: 1
      since: "2024-10-22"
      basis: >-
        One public case of a lab's own agents doing $10m+ of third-party harm (OpenAI's agents at Hugging Face, July
        2026) since agents with computer use reached the frontier in October 2024. Anthropic's model also broke into
        three companies, with harm undisclosed, so it is not counted.
      sources: [openai_huggingface_2026, techcrunch_ai_hack_liability_2026]
  causal:
    bio_misuse:
      - key: attempts
        label: Serious attempts at a mass-casualty biological attack, a year
        unit: count
        low: 0.1
        central: 0.5
        high: 2
        basis: >-
          Groups with the intent and some resources (Aum Shinrikyo in the 1990s, the 2001 anthrax letters) appear a few
          times a decade in the public record; more may never surface. Judgement.
      - key: uses_model
        label: Share that use a frontier model for real help
        low: 0.3
        central: 0.6
        high: 0.9
        basis: Judgement.
      - key: safeguards_fail
        label: Share where the model's safeguards don't stop them
        low: 0.1
        central: 0.3
        high: 0.6
        basis: >-
          FRI's experts thought closed weights, anti-jailbreak safeguards and DNA screening cut their risk estimate by
          about two thirds (1.25% to 0.4%), so about a third gets through.
        sources: [fri_llm_biorisk_2025]
      - key: decisive
        label: Chance the model's help is decisive
        low: 0.05
        central: 0.2
        high: 0.5
        basis: >-
          RAND's 2024 red team found no measurable uplift from 2023 models; FRI reports o3 matching top virologists on
          troubleshooting. Help with planning is not help at the bench.
        sources: [rand_2024_red_team, fri_llm_biorisk_2025]
      - key: produce_release
        label: Chance they then make and release an agent that spreads
        low: 0.05
        central: 0.15
        high: 0.4
        basis: "The wet lab, not the information, has been the bottleneck. Judgement."
      - key: reaches_threshold
        label: Chance the outbreak costs $1tn or more
        low: 0.1
        central: 0.3
        high: 0.6
        basis: "COVID cost the US alone about $16tn, so the threshold is within reach of a successful release. Judgement."
        sources: [covid_us_cost]
    cyber_misuse:
      - key: big_events
        label: Cyber events costing $10bn or more, a year, from any cause
        unit: count
        low: 0.3
        central: 0.7
        high: 1.5
        basis: "NotPetya, CrowdStrike and Change Healthcare's wider costs: roughly one every year or two."
        sources: [notpetya_insured_loss, crowdstrike_2024_outage, change_healthcare_2024]
      - key: attacker_uses_model
        label: Share where the attacker uses frontier models in the operation
        low: 0.2
        central: 0.5
        high: 0.9
        basis: "GTG-1002 shows state-backed groups already run intrusion campaigns with AI agents. Judgement."
        sources: [anthropic_gtg1002_espionage]
      - key: decisive
        label: Chance the model is what makes it a catastrophe
        low: 0.02
        central: 0.1
        high: 0.3
        basis: "Most $10bn events turn on a single bug or misconfiguration, not on the attacker's skill. Judgement."
      - key: not_stopped
        label: Share not stopped by the labs' safeguards and monitoring
        low: 0.3
        central: 0.6
        high: 0.9
        basis: "Judgement."
    agent_runaway:
      - key: campaigns
        label: Agent runs a year, across the members, with real-world access
        unit: count
        low: 50
        central: 200
        high: 1000
        basis: "Large evaluation and RL campaigns with internet or production access. Judgement."
      - key: oversteps
        label: Chance a run has agents act outside their permissions
        low: 0.01
        central: 0.03
        high: 0.1
        basis: "OpenAI and Anthropic both disclosed in 2026 that agents in testing had broken into other companies' systems."
        sources: [openai_huggingface_2026, techcrunch_ai_hack_liability_2026]
      - key: undetected
        label: Chance it goes on long enough to do real damage
        low: 0.2
        central: 0.4
        high: 0.8
        basis: "Anthropic found its model's three break-ins only months later, after OpenAI's disclosure."
        sources: [techcrunch_ai_hack_liability_2026]
      - key: over_threshold
        label: Chance third parties' harm passes $10m
        low: 0.1
        central: 0.2
        high: 0.5
        basis: "Hugging Face rebuilt about a third of its infrastructure. Judgement."
        sources: [openai_huggingface_2026]

# Who pays (catmodel/legal.py). A peril's attribution, built up from the law: the chance a claim against the lab
# survives, times the share of the loss victims can claim at all, times what the lab pays of that. Where liability is
# joint and several the lab pays the attacker's share too; elsewhere only its own share of fault:
#   attribution = liable x recoverable x (joint + (1 - joint) x fault_share)
# The peril's `attribution` above is this chain at each level. `scenarios` change links to show what a law would do.
legal:
  attribution:
    cyber_misuse:
      - key: liable
        label: Chance a claim against the lab survives duty and causation
        low: 0.2
        central: 0.5
        high: 0.8
        basis: >-
          A hacker's crime does not cut off the duty of a defendant whose weak safeguards were meant to stop it: § 449,
          and Dittman for a data breach. Design-defect claims against an AI product can proceed (Garcia), as can gross
          negligence against a software supplier (Delta v. CrowdStrike). Against that, harmful code may look like
          protected "expression", and plaintiffs must show the model, not the attacker's skill, made the difference.
          The numbers are judgement.
        sources: [restatement_448_449_superseding_cause, dittman_v_upmc_2018, garcia_v_character_technologies_2025, delta_v_crowdstrike_2025]
      - key: recoverable
        label: Share of the loss victims can claim at all
        low: 0.1
        central: 0.25
        high: 0.6
        basis: >-
          Most of a cyber catastrophe's cost is business interruption to companies with no tie to the lab. The
          economic loss rule bars that in negligence in most states (Southern California Gas Leak Cases, 532 Madison).
          What remains is damage to systems and data, injuries, and customers, whose contracts may cap recovery
          (CrowdStrike says Delta's claim is capped at single-digit millions). The high end is states that follow
          Pennsylvania's source-of-duty test (Dittman); the California court left the cyber case open. The EU
          directive covers only consumers. The shares are judgement.
        sources: [southern_california_gas_leak_2019, dittman_v_upmc_2018, delta_v_crowdstrike_2025, eu_product_liability_directive_2024]
      - key: joint
        label: Share of those claims where the lab can be made to pay the attacker's share
        low: 0.2
        central: 0.5
        high: 0.8
        basis: >-
          Most courts do not let a jury give the intentional wrongdoer a share in a suit against the negligent party,
          and Restatement § 14 makes the negligent party jointly liable for it; California keeps joint liability for
          economic damages. Idaho-style statutes compare the two and make each pay only its own share. The mix of
          forums is judgement.
        sources: [restatement_third_apportionment_14, california_civil_code_1431_2]
      - key: fault_share
        label: The lab's share of fault where it pays only its own
        low: 0.05
        central: 0.15
        high: 0.3
        basis: >-
          The Restatement warns that a jury comparing a negligent party with an intentional one will put the bulk of
          the fault on the intentional one. Judgement.
        sources: [restatement_third_apportionment_14]
  scenarios:
    - key: central
      label: The central reading
      changes: {}
    - key: lead_act
      label: The AI LEAD Act passes
      changes: {cyber_misuse: {liable: 0.7, recoverable: 0.6}}
      basis: >-
        Financial injury counts as harm, so the economic loss rule no longer bars a product claim, and foreseeable
        misuse becomes a question of design. The values are judgement.
      sources: [ai_lead_act_s2937]
    - key: shield
      label: A firearms-style shield for misuse
      changes: {cyber_misuse: {liable: 0.02}}
      basis: "Congress bars claims over criminal misuse, as PLCAA does for guns, leaving narrow exceptions. Judgement."
      sources: [plcaa_firearms_immunity]
    - key: all_joint
      label: Joint and several everywhere
      changes: {cyber_misuse: {joint: 1}}
      basis: "Every forum follows Restatement § 14 or refuses to compare fault with the attacker."
      sources: [restatement_third_apportionment_14]
    - key: all_several
      label: Several only everywhere
      changes: {cyber_misuse: {joint: 0}}
      basis: "Every forum compares fault and the lab pays only its own share, as in Idaho."
      sources: [restatement_third_apportionment_14]

# Who carries the risk (catmodel/carriers.py). The same simulated losses, carried five ways. `changes` are settings that
# differ from the central mutual; everything else stays central. The qualitative columns are judgement.
carriers:
  - key: mutual
    label: A mutual of the labs (AIUC's proposal)
    changes: {}
    basis: "Five labs pool $5bn of paid-in capital and can each be called for $1bn more, as in Price-Anderson."
    independence: "Weakest: the insured own it."
    incentive: "Members pay for each other's losses, so they have reason to police each other, as Factory Mutual's mill owners did."
    capacity: "What the labs put in."
    sources: [aiuc_mutual_proposal, price_anderson, factory_mutual_1835]
  - key: captive
    label: Each lab insures itself (a captive)
    changes: {members: 1, paid_in_capital: 1.0, callable_per_member: 0.0}
    basis: "Each lab holds its fifth of the capital alone. Nothing is pooled, and a parent's promise to recapitalise does not count."
    independence: "None: the lab marks its own homework."
    incentive: "Only the lab's own losses, which it bears anyway."
    capacity: "One lab's balance sheet."
    sources: []
  - key: commercial
    label: A diversified insurer or reinsurer
    changes: {cost_of_capital: 0.06, callable_per_member: 0.0}
    basis: >-
      The same $5bn of capital, held by a carrier whose other books (natural catastrophe, life) do not lose money in an
      AI catastrophe, so it asks a lower return on it: the low end of the cost-of-capital range. This flatters it: its
      cyber, tech E&O and D&O books would lose money on the same day.
    independence: "Strongest: paid by the labs, but loses its own money if it misprices."
    incentive: "Its own claims only, which today's law keeps small."
    capacity: >-
      Large in principle but voluntary: standalone AI cover runs to tens of millions per insured, and many carriers are
      writing AI out of existing policies.
    sources: [armilla_ai_liability_limit, leung_2026_insurability_frontier]
  - key: stack
    label: The mutual, with reinsurance above it
    changes: {reinsurance_attach: 1.0, reinsurance_limit: 4.0}
    basis: >-
      The mutual keeps the first $1bn of claims in a year; reinsurers or a cat bond take the next $4bn, priced at the
      reinsurance price lever (10 times expected loss, as the first cyber cat bonds were).
    independence: "Mixed: the reinsurer prices its layer from outside."
    incentive: "Members police the bottom layer; the reinsurer's price is an outside signal of risk."
    capacity: "The mutual's, plus whatever the market will write."
    sources: [aiuc_mutual_proposal, cyber_cat_bond_polestar, leung_2026_insurability_frontier]
  - key: backstop
